server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8084
spring:
  profiles:
    default: local
  application:
    name: admin-service
eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_ADVERTISED_ADDRESS:127.0.0.1}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:}
