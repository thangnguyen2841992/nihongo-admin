server:
  port: 8084
spring:
  config:
    import: "optional:file:./.local/shared.properties,optional:file:../.local/shared.properties"
  application:
    name: admin-service
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET}
